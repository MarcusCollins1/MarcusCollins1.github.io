<!-- game.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Family Framed - Game</title>
    <link rel="stylesheet" href="game.css" />
    <link rel="icon" type="image/ico" href="familyFramed.ico">
</head>
<body>
    <button id="backBtn" class="return-button">← Back</button>

    <div class="container">
        <h1 class="title">Family Framed</h1>

        <p id="statusText">Loading...</p>

        <div id="gameArea" class="hidden">
            <p id="timerText">00:00</p>
            <img id="imgBox">
            <div id="searchContainer">
                <input type="search" id="guessInput" placeholder="Search..." autocomplete="off" list="suggestions">
                <datalist id="suggestions"></datalist>
                <button id="submitBtn">Submit</button>
            </div>
            <div id="previousGuessesContainer"></div>
            <p id="guessesRemainingText"></p>
        </div>
        <button id="logoutBtn">Logout</button>
    </div>

    <script type="module" src="game.js"></script>
</body>
</html>
