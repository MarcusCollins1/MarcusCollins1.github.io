<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>University Challenge - Admin</title>

    <link rel="stylesheet" href="UniversityChallengeAdmin.css">
    <link rel="icon" type="image/ico" href="universityChallengeAdmin.ico">
</head>
<body>
    <div class="container">

        <!-- Create game -->
        <div id="createPanel" class="panel">
            <button id="createGameBtn" type="button">
                Create Game
            </button>
        </div>

        <!-- Game information -->
        <div id="gamePanel" class="panel game-code">
            <p>Game Code</p>

            <div id="gameCode"></div>

            <p>Give this code to the players</p>

            <button id="hideGameCodeBtn" type="button">Hide Game Code</button>
          </div>

        <!-- Teams -->
        <div id="teamsPanel" class="panel">

            <h2>Teams</h2>

            <div class="teams">
                <div class="team">
                    <input type="text" id="teamAName" class="team-name" value="Team A">

                    <ul id="teamAPlayers">
                        <!-- Players will appear here -->
                    </ul>

                    <div class="score-container">
                        <div class="score">
                            Score: <span id="teamAScore">0</span>
                        </div>
                        
                        <div class="score-buttons">
                            <button class="scoreBtn" data-team="A" data-amount="10" type="button">+10</button>
                            <button class="scoreBtn" data-team="A" data-amount="5" type="button">+5</button>
                            <button class="scoreBtn" data-team="A" data-amount="-5" type="button">-5</button>
                        </div>
                    </div>
                </div>

                <div class="team">
                    <input type="text" id="teamBName" class="team-name" value="Team B">

                    <ul id="teamBPlayers">
                        <!-- Players will appear here -->
                    </ul>

                    <div class="score-container">
                        <div class="score">
                            Score: <span id="teamBScore">0</span>
                        </div>
                        
                        <div class="score-buttons">
                            <button class="scoreBtn" data-team="B" data-amount="10" type="button">+10</button>
                            <button class="scoreBtn" data-team="B" data-amount="5" type="button">+5</button>
                            <button class="scoreBtn" data-team="B" data-amount="-5" type="button">-5</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Winner -->
         <div id="winnerPanel" class="panel winner">
            <div>FIRST TO BUZZ</div>

            <div id="winnerName">Nobody</div>

            <div id="winnerTeam">-</div>

            <button id="resetBtn" type="button">Reset Buzzers</button>
            <br>
            <button id="deleteGameBtn" type="button">Delete Game</button>
         </div>
    </div>

    <script type="module" src="UniversityChallengeAdmin.js"></script>
</body>
</html>
