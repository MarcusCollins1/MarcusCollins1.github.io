<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping List</title>
    <link rel="stylesheet" href="shoppingList.css">
    <link rel="icon" type="image/ico" href="shoppingList.ico">
</head>
<body>
    <button id="return-button" class="return-button" onclick="location.href='../../tools.html'">← Return</button>

    <h1>Shopping List</h1>

    <form id="itemForm">
        <input id="itemInput" type="text" placeholder="Add an item..." autocomplete="off" />
        <button type="submit">Add</button>
    </form>
    <button id="clearAllBtn">Clear All</button>

    <ul id="itemsList"></ul>

    <script src="shoppingList.js" type="module"></script>
</body>
</html>
